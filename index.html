<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>مكتب عقود إيجار | بيانات العقار</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px 12px 42px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 7px 28px rgba(0,0,0,.08)}
.header{text-align:center;padding:8px 0 18px}.title{font-size:25px;font-weight:800;margin:0}.phone{display:inline-block;margin-top:7px;color:#0b57d0;text-decoration:none;font-size:18px;font-weight:700;direction:ltr}
.intro{margin:4px 0 0;color:#6b7280;font-size:14px;line-height:1.7}h2{font-size:17px;margin:22px 0 12px;padding-bottom:9px;border-bottom:1px solid #e9ecef}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.field{margin-bottom:2px}.full{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 6px}
input,select{width:100%;height:46px;padding:0 12px;border:1px solid #d7dce2;border-radius:11px;background:#fff;color:#222;font-size:15px}
input:focus,select:focus{outline:2px solid #dbeafe;border-color:#2563eb}
button{width:100%;height:50px;margin-top:24px;border:0;border-radius:12px;background:#16a34a;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
button:active{transform:scale(.99)}.note{text-align:center;color:#777;font-size:12px;line-height:1.6;margin:10px 0 0}
.req{color:#c62828}.error{display:none;background:#fff1f2;color:#9f1239;padding:10px;border-radius:10px;margin-top:12px;font-size:13px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:17px}.title{font-size:23px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<header class="header">
<h1 class="title">مكتب عقود إيجار</h1>
<a class="phone" href="tel:0536305035">0536305035</a>
<p class="intro">بيانات العقار المطلوبة لإعداد العقد</p>
</header>

<form id="form">
<h2>بيانات العقار</h2><div class="grid">
<div class="field full"><label>1. رقم جوال المتواصل معنا عبر واتساب <span class="req">*</span></label><input name="phone" inputmode="tel" required></div>
<div class="field"><label>2. نوع العقار <span class="req">*</span></label><select name="propertyType" required><option value="">اختر</option><option>عمارة</option><option>فيلا</option><option>مجمع تجاري مفتوح (بلازا)</option><option>مجمع تجاري مغلق (مول)</option><option>أرض</option><option>برج</option><option>استراحة</option></select></div>
<div class="field"><label>3. استخدام العقار <span class="req">*</span></label><select name="usage" required><option value="">اختر</option><option>سكني عائلات</option><option>سكني - تجاري</option><option>تجاري</option><option>سكني أفراد</option></select></div>
<div class="field"><label>4. عدد الطوابق في العقار كامل</label><input name="floors" type="number" min="0"></div>
<div class="field"><label>5. عدد الوحدات في كل طابق</label><input name="unitsPerFloor" type="number" min="0"></div>
<div class="field"><label>6. عدد المصاعد في العقار</label><input name="elevators" type="number" min="0"></div>
<div class="field"><label>7. عدد المواقف في العقار</label><input name="parking" type="number" min="0"></div>
</div>

<h2>بيانات الوحدة</h2><div class="grid">
<div class="field"><label>8. رقم الوحدة أو اسمها <span class="req">*</span></label><input name="unitName" required></div>
<div class="field"><label>9. نوع الوحدة <span class="req">*</span></label><select name="unitType" required><option value="">اختر</option><option>شقة</option><option>فيلا</option><option>محل</option><option>كشك</option><option>ورشة</option><option>أرض</option><option>محطة</option><option>مكتب</option><option>مستودع</option><option>معرض</option><option>صراف</option><option>فندق</option><option>بلازا</option><option>مول</option><option>دور</option><option>عمارة</option><option>برج</option><option>شقة صغيرة (استوديو)</option><option>شقة ملحق</option><option>غرفة سائق</option><option>استراحة</option><option>شقة دورين</option></select></div>
<div class="field"><label>10. رقم الطابق الذي تقع فيه الوحدة</label><input name="floor"></div>
<div class="field"><label>11. مساحة الوحدة</label><input name="area" inputmode="decimal"></div>
<div class="field"><label>12. هل الوحدة مؤثثة؟</label><select name="furnished"><option value="">اختر</option><option>نعم</option><option>لا</option></select></div>
<div class="field"><label>13. هل يوجد دواليب مطبخ؟</label><select name="kitchenCabinets"><option value="">اختر</option><option>نعم</option><option>لا</option></select></div>
<div class="field"><label>14. عدد غرف النوم</label><input name="bedrooms" type="number" min="0"></div>
<div class="field"><label>15. عدد الصالات</label><input name="livingRooms" type="number" min="0"></div>
<div class="field"><label>16. عدد الحمامات</label><input name="bathrooms" type="number" min="0"></div>
<div class="field"><label>17. عدد المطابخ</label><input name="kitchens" type="number" min="0"></div>
<div class="field"><label>18. عدد المجالس</label><input name="majlis" type="number" min="0"></div>
<div class="field"><label>19. عدد المخازن</label><input name="storage" type="number" min="0"></div>
<div class="field"><label>20. عدد مكيفات السبليت</label><input name="splitAC" type="number" min="0"></div>
<div class="field"><label>21. عدد مكيفات الشباك</label><input name="windowAC" type="number" min="0"></div>
<div class="field"><label>22. رقم عداد الكهرباء إن وجد أو اكتب طلبك</label><input name="electricity"></div>
<div class="field"><label>23. رقم عداد الماء إن وجد أو اكتب طلبك</label><input name="water"></div>
</div>

<button type="submit">إرسال البيانات عبر واتساب</button>
<p class="note">بعد الضغط سيتم فتح واتساب والرسالة جاهزة للإرسال إلى مكتب عقود إيجار.</p>
<div id="error" class="error">تعذر فتح واتساب تلقائيًا. جرّب فتح الموقع في Safari أو Chrome ثم الضغط على الزر مرة أخرى.</div>
</form></div></div>

<script>
const receiver="966536305035";
const form=document.getElementById("form");
form.addEventListener("submit",function(e){
 e.preventDefault();
 if(!form.reportValidity()) return;
 const d=new FormData(form);
 const v=k=>(d.get(k)||"").trim()||"غير متوفر";
 const msg=`*بيانات العقار - مكتب عقود إيجار*

1. رقم جوال المتواصل معنا عبر واتساب: ${v("phone")}
2. نوع العقار: ${v("propertyType")}
3. استخدام العقار: ${v("usage")}
4. عدد الطوابق في العقار كامل: ${v("floors")}
5. عدد الوحدات في كل طابق: ${v("unitsPerFloor")}
6. عدد المصاعد في العقار: ${v("elevators")}
7. عدد المواقف في العقار: ${v("parking")}

*بيانات الوحدة*

8. رقم الوحدة أو اسمها: ${v("unitName")}
9. نوع الوحدة: ${v("unitType")}
10. رقم الطابق الذي تقع فيه الوحدة: ${v("floor")}
11. مساحة الوحدة: ${v("area")}
12. هل الوحدة مؤثثة؟ ${v("furnished")}
13. هل يوجد دواليب مطبخ؟ ${v("kitchenCabinets")}
14. عدد غرف النوم: ${v("bedrooms")}
15. عدد الصالات: ${v("livingRooms")}
16. عدد الحمامات: ${v("bathrooms")}
17. عدد المطابخ: ${v("kitchens")}
18. عدد المجالس: ${v("majlis")}
19. عدد المخازن: ${v("storage")}
20. عدد مكيفات السبليت: ${v("splitAC")}
21. عدد مكيفات الشباك: ${v("windowAC")}
22. رقم عداد الكهرباء: ${v("electricity")}
23. رقم عداد الماء: ${v("water")}`;
 const url="https://wa.me/"+receiver+"?text="+encodeURIComponent(msg);
 const w=window.open(url,"_blank");
 if(!w){document.getElementById("error").style.display="block";location.href=url;}
});
</script>
</body>
</html>
